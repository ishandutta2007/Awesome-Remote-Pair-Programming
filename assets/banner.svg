<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.3" />
    </pattern>

    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.4; transform: scale(1); }
        50% { opacity: 0.8; transform: scale(1.05); }
      }
      @keyframes dash {
        to { stroke-dashoffset: -40; }
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-5px); }
      }
      .anim-dash {
        stroke-dasharray: 8 6;
        animation: dash 1.5s linear infinite;
      }
      .anim-blink {
        animation: blink 1s step-start infinite;
      }
      .anim-float {
        animation: float 4s ease-in-out infinite;
      }
      .cursor-a {
        fill: #38bdf8;
      }
      .cursor-b {
        fill: #ec4899;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="420" fill="url(#bgGrad)" rx="16" />
  <rect width="1200" height="420" fill="url(#grid)" rx="16" />

  <!-- Ambient Glow Orbs -->
  <circle cx="200" cy="100" r="140" fill="#38bdf8" opacity="0.08" filter="url(#glow)">
    <animate attributeName="opacity" values="0.05;0.12;0.05" dur="4s" repeatCount="indefinite" />
  </circle>
  <circle cx="1000" cy="300" r="160" fill="#a855f7" opacity="0.08" filter="url(#glow)">
    <animate attributeName="opacity" values="0.08;0.15;0.08" dur="5s" repeatCount="indefinite" />
  </circle>
  <circle cx="600" cy="200" r="180" fill="#6366f1" opacity="0.06" filter="url(#glow)">
    <animate attributeName="opacity" values="0.04;0.1;0.04" dur="6s" repeatCount="indefinite" />
  </circle>

  <!-- Top Bar Decorative Pill -->
  <g transform="translate(430, 28)">
    <rect width="340" height="28" rx="14" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <circle cx="20" cy="14" r="5" fill="#10b981">
      <animate attributeName="r" values="4;6;4" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="35" y="19" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="1">REAL-TIME MULTIPLAYER COLLABORATION</text>
  </g>

  <!-- Main Title -->
  <text x="600" y="95" text-anchor="middle" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="42" font-weight="800" letter-spacing="-0.5" filter="url(#softGlow)">Awesome Remote Pair Programming</text>

  <!-- Subtitle -->
  <text x="600" y="130" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400">Low-Latency Screen Sharing • Shared IDE Sessions • Multiplayer Editors • Mob Programming</text>

  <!-- Left IDE Window (Host / Dev A) -->
  <g transform="translate(80, 165)" class="anim-float">
    <rect width="420" height="200" rx="12" fill="url(#cardGrad1)" stroke="#334155" stroke-width="1.5" />
    <!-- Window Header -->
    <path d="M 0 12 C 0 5.37 5.37 0 12 0 L 408 0 C 414.63 0 420 5.37 420 12 L 420 34 L 0 34 Z" fill="#0f172a" />
    <circle cx="20" cy="17" r="5.5" fill="#ef4444" />
    <circle cx="38" cy="17" r="5.5" fill="#f59e0b" />
    <circle cx="56" cy="17" r="5.5" fill="#10b981" />
    <text x="80" y="21" fill="#64748b" font-family="monospace" font-size="12">host: dev-alice (VS Code)</text>
    <rect x="330" y="8" width="76" height="18" rx="9" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1" />
    <text x="368" y="21" text-anchor="middle" fill="#38bdf8" font-family="sans-serif" font-size="10" font-weight="bold">HOST ● LIVE</text>

    <!-- Code Content -->
    <g transform="translate(20, 55)" font-family="Consolas, 'Courier New', monospace" font-size="13">
      <text y="0" fill="#64748b">1  <tspan fill="#f43f5e">async function</tspan> <tspan fill="#38bdf8">pairProgram</tspan>() {</text>
      <text y="24" fill="#64748b">2    <tspan fill="#c084fc">const</tspan> session = <tspan fill="#f43f5e">await</tspan> liveShare.connect({</text>
      <text y="48" fill="#64748b">3      latency: <tspan fill="#34d399">"12ms"</tspan>, audio: <tspan fill="#38bdf8">true</tspan>,</text>
      <text y="72" fill="#64748b">4      driver: <tspan fill="#38bdf8">"Alice"</tspan>, nav: <tspan fill="#ec4899">"Bob"</tspan></text>
      <text y="96" fill="#64748b">5    });</text>
      <text y="120" fill="#64748b">6    session.<tspan fill="#60a5fa">syncCursor</tspan>();<tspan fill="#38bdf8" class="anim-blink">█</tspan></text>
    </g>

    <!-- Dev A Cursor Tag -->
    <g transform="translate(265, 160)">
      <polygon points="0,0 4,14 8,10 14,14 11,8 14,4" fill="#38bdf8" />
      <rect x="8" y="10" width="48" height="18" rx="4" fill="#0284c7" />
      <text x="32" y="23" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold">Alice</text>
    </g>
  </g>

  <!-- Central Synced Connection Stream -->
  <g transform="translate(500, 240)">
    <!-- Animated Flow Lines -->
    <path d="M 0 10 C 60 10, 140 10, 200 10" fill="none" stroke="#334155" stroke-width="3" />
    <path d="M 0 10 C 60 10, 140 10, 200 10" fill="none" stroke="url(#accentGrad)" stroke-width="3" class="anim-dash" />
    
    <!-- Central Sync Core Badge -->
    <circle cx="100" cy="10" r="28" fill="#0f172a" stroke="#818cf8" stroke-width="2" filter="url(#glow)" />
    <!-- Bi-directional arrows icon -->
    <path d="M 88 6 L 94 0 L 94 4 L 106 4 L 106 8 L 94 8 L 94 12 Z" fill="#38bdf8">
      <animateTransform attributeName="transform" type="translate" values="0,0; 4,0; 0,0" dur="1.5s" repeatCount="indefinite" />
    </path>
    <path d="M 112 14 L 106 20 L 106 16 L 94 16 L 94 12 L 106 12 L 106 8 Z" fill="#ec4899">
      <animateTransform attributeName="transform" type="translate" values="0,0; -4,0; 0,0" dur="1.5s" repeatCount="indefinite" />
    </path>
    <text x="100" y="52" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="11" font-weight="bold">P2P WEBRTC</text>
    <text x="100" y="66" text-anchor="middle" fill="#34d399" font-family="monospace" font-size="10">&lt; 20ms sync</text>
  </g>

  <!-- Right IDE Window (Guest / Dev B) -->
  <g transform="translate(700, 165)" class="anim-float" style="animation-delay: -2s;">
    <rect width="420" height="200" rx="12" fill="url(#cardGrad1)" stroke="#334155" stroke-width="1.5" />
    <!-- Window Header -->
    <path d="M 0 12 C 0 5.37 5.37 0 12 0 L 408 0 C 414.63 0 420 5.37 420 12 L 420 34 L 0 34 Z" fill="#0f172a" />
    <circle cx="20" cy="17" r="5.5" fill="#ef4444" />
    <circle cx="38" cy="17" r="5.5" fill="#f59e0b" />
    <circle cx="56" cy="17" r="5.5" fill="#10b981" />
    <text x="80" y="21" fill="#64748b" font-family="monospace" font-size="12">guest: dev-bob (Zed / Hopp)</text>
    <rect x="330" y="8" width="76" height="18" rx="9" fill="#db2777" fill-opacity="0.2" stroke="#ec4899" stroke-width="1" />
    <text x="368" y="21" text-anchor="middle" fill="#ec4899" font-family="sans-serif" font-size="10" font-weight="bold">PAIRED ● 4K</text>

    <!-- Code Content Synchronized -->
    <g transform="translate(20, 55)" font-family="Consolas, 'Courier New', monospace" font-size="13">
      <text y="0" fill="#64748b">1  <tspan fill="#f43f5e">async function</tspan> <tspan fill="#38bdf8">pairProgram</tspan>() {</text>
      <text y="24" fill="#64748b">2    <tspan fill="#c084fc">const</tspan> session = <tspan fill="#f43f5e">await</tspan> liveShare.connect({</text>
      <text y="48" fill="#64748b">3      latency: <tspan fill="#34d399">"12ms"</tspan>, audio: <tspan fill="#38bdf8">true</tspan>,</text>
      <text y="72" fill="#64748b">4      driver: <tspan fill="#38bdf8">"Alice"</tspan>, nav: <tspan fill="#ec4899">"Bob"</tspan></text>
      <text y="96" fill="#64748b">5    });</text>
      <text y="120" fill="#64748b">6    session.<tspan fill="#60a5fa">syncCursor</tspan>();<tspan fill="#ec4899" class="anim-blink">█</tspan></text>
    </g>

    <!-- Dev B Cursor Tag -->
    <g transform="translate(230, 80)">
      <polygon points="0,0 4,14 8,10 14,14 11,8 14,4" fill="#ec4899" />
      <rect x="8" y="10" width="44" height="18" rx="4" fill="#be185d" />
      <text x="30" y="23" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold">Bob</text>
    </g>
  </g>

  <!-- Bottom Feature Badges -->
  <g transform="translate(160, 385)">
    <g transform="translate(0, 0)">
      <rect width="180" height="24" rx="6" fill="#1e293b" stroke="#334155" />
      <text x="90" y="16" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="600">⚡ Low Latency Screen Share</text>
    </g>
    <g transform="translate(220, 0)">
      <rect width="180" height="24" rx="6" fill="#1e293b" stroke="#334155" />
      <text x="90" y="16" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="600">🤝 Shared IDE &amp; Terminals</text>
    </g>
    <g transform="translate(440, 0)">
      <rect width="190" height="24" rx="6" fill="#1e293b" stroke="#334155" />
      <text x="95" y="16" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="600">👥 Dual Mouse &amp; Remote Control</text>
    </g>
    <g transform="translate(670, 0)">
      <rect width="180" height="24" rx="6" fill="#1e293b" stroke="#334155" />
      <text x="90" y="16" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="600">🌐 Top SaaS &amp; Open Source</text>
    </g>
  </g>
</svg>
